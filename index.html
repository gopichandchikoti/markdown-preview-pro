<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-text="ui.md.preview.pro.markdown.editor.live.preview"></title>
  <meta name="description" content="" data-meta="ui.a.full.featured.markdown.editor.with.live.preview.dark.light.mode.formatting.toolbar.sync.">
  <link rel="icon" data-asset="assets.favicon">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="app">
    <!-- ── Toolbar ── -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="tool-btn" id="explorerToggle" aria-controls="explorer" aria-expanded="true" data-text="glyph.menu" data-label="workspace.toggle"></button>
        <!-- Logo -->
        <div style="display:flex;align-items:center;gap:8px;margin-right:8px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M8 8l2 4-2 4"></path><path d="M14 8h3"></path><path d="M14 12h3"></path><path d="M14 16h3"></path></svg>
          <span style="font-weight:700;font-size:14px;"><span data-text="app.name"></span></span>
        </div>
        <div class="toolbar-sep"></div>

        <!-- Format buttons -->
        <button class="tool-btn" data-command="insertFormat('**','**')" data-tip-key="ui.bold.ctrl.b">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 4h8a4 4 0 0 1 0 8H6z"></path><path d="M6 12h9a4 4 0 0 1 0 8H6z"></path></svg>
        </button>
        <button class="tool-btn" data-command="insertFormat('*','*')" data-tip-key="ui.italic.ctrl.i">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>
        </button>
        <button class="tool-btn" data-command="insertFormat('~~','~~')" data-tip-key="ui.strikethrough">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 4H9a3 3 0 0 0 0 6h6a3 3 0 0 1 0 6H8"></path><line x1="4" y1="12" x2="20" y2="12"></line></svg>
        </button>
        <div class="toolbar-sep"></div>
        <button class="tool-btn" data-command="insertPrefix('# ')" data-tip-key="ui.heading.1"><span class="label"><span data-text="ui.h1"></span></span></button>
        <button class="tool-btn" data-command="insertPrefix('## ')" data-tip-key="ui.heading.2"><span class="label"><span data-text="ui.h2"></span></span></button>
        <button class="tool-btn" data-command="insertPrefix('### ')" data-tip-key="ui.heading.3"><span class="label"><span data-text="ui.h3"></span></span></button>
        <div class="toolbar-sep"></div>
        <button class="tool-btn" data-command="insertPrefix('- ')" data-tip-key="ui.bullet.list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><circle cx="4" cy="6" r="1" fill="currentColor"></circle><circle cx="4" cy="12" r="1" fill="currentColor"></circle><circle cx="4" cy="18" r="1" fill="currentColor"></circle></svg>
        </button>
        <button class="tool-btn" data-command="insertPrefix('1. ')" data-tip-key="ui.numbered.list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><text x="3" y="8" fill="currentColor" font-size="8" font-weight="600" data-text="ui.1"></text><text x="3" y="14" fill="currentColor" font-size="8" font-weight="600" data-text="ui.2"></text><text x="3" y="20" fill="currentColor" font-size="8" font-weight="600" data-text="ui.3"></text></svg>
        </button>
        <button class="tool-btn" data-command="insertPrefix('- [ ] ')" data-tip-key="ui.task.list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="6" height="6" rx="1"></rect><line x1="12" y1="8" x2="21" y2="8"></line><rect x="3" y="13" width="6" height="6" rx="1"></rect><path d="M4.5 16.5l1.5 1.5 3-3"></path><line x1="12" y1="16" x2="21" y2="16"></line></svg>
        </button>
        <div class="toolbar-sep"></div>
        <button class="tool-btn" data-command="insertPrefix('> ')" data-tip-key="ui.blockquote">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V21z"></path><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3z"></path></svg>
        </button>
        <button class="tool-btn" data-command="insertFormat('`','`')" data-tip-key="ui.inline.code">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        </button>
        <button class="tool-btn" data-command="insertCodeBlock()" data-tip-key="ui.code.block">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><polyline points="10 8 6 12 10 16"></polyline><polyline points="14 8 18 12 14 16"></polyline></svg>
        </button>
        <button class="tool-btn" data-command="insertTable()" data-tip-key="ui.table">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
        </button>
        <button class="tool-btn" data-command="insertLink()" data-tip-key="ui.link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        </button>
        <button class="tool-btn" data-command="insertHR()" data-tip-key="ui.divider">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="2" y1="12" x2="22" y2="12"></line></svg>
        </button>
      </div>

      <div class="toolbar-right">
        <!-- Theme toggle -->
        <div class="theme-toggle" id="themeToggle" data-command="toggleTheme()">
          <div class="theme-toggle-option" id="lightOption" data-tip-key="ui.light">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </div>
          <div class="theme-toggle-option" id="darkOption" data-tip-key="ui.dark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </div>
        </div>

        <div class="toolbar-sep"></div>

        <button class="tool-btn" id="outlineBtn" data-command="toggleOutline()" data-tip-key="ui.outline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="10" y2="6"></line><line x1="6" y1="12" x2="16" y2="12"></line><line x1="6" y1="18" x2="13" y2="18"></line><circle cx="3" cy="12" r="1" fill="currentColor"></circle><circle cx="3" cy="18" r="1" fill="currentColor"></circle></svg>
        </button>
        <button class="tool-btn active" id="syncBtn" data-command="toggleSync()" data-tip-key="ui.sync.scroll">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"></path><path d="M21 8h-3a2 2 0 0 1-2-2V3"></path><path d="M3 16h3a2 2 0 0 1 2 2v3"></path><path d="M16 21v-3a2 2 0 0 1 2-2h3"></path></svg>
        </button>
        <button class="tool-btn active" id="wrapBtn" data-command="toggleWrap()" data-tip-key="ui.word.wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"></path><path d="M3 12h15a3 3 0 1 1 0 6h-4"></path><polyline points="13 16 11 18 13 20"></polyline><path d="M3 18h4"></path></svg>
        </button>
        <div class="toolbar-sep"></div>
        <button class="tool-btn" data-command="exportMarkdown()" data-tip-key="ui.download.md">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>
        <button class="tool-btn" data-command="copyHTML()" data-tip-key="ui.copy.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
        <button class="tool-btn" data-command="toggleSearch()" data-tip-key="ui.find.ctrl.f">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <button class="tool-btn" data-command="clearEditor()" data-tip-key="ui.clear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
        </button>
      </div>
    </div>

    <div class="workspace-shell" id="workspaceShell">
      <aside id="explorer" class="explorer" data-label="workspace.explorer">
        <div class="explorer-header"><h2 data-text="workspace.explorer"></h2><button id="explorerClose" data-label="workspace.close" data-text="glyph.close"></button></div>
        <div class="explorer-create"><button id="explorerNew" data-text="workspace.newFile"></button><button id="folderNew" data-text="workspace.newFolder"></button></div>
        <input type="search" id="explorerFilter" data-label="workspace.filter" data-placeholder="workspace.filter">
        <ul role="tree" id="explorerTree" data-label="workspace.explorer"></ul>
        <p id="selectionName"></p>
        <div class="explorer-actions">
          <button id="action-rename" data-text="workspace.rename"></button><button id="action-move" data-text="workspace.move"></button>
          <button id="action-duplicate" data-text="workspace.duplicate"></button><button id="action-delete" data-text="workspace.delete"></button>
        </div>
        <div class="workspace-backups"><button id="exportWorkspace" data-text="backup.export"></button><button id="importWorkspace" data-text="backup.import"></button><input type="file" id="backupFile" accept=".json,application/json" hidden=""><button id="persistentStorage" data-text="storage.persist"></button></div>
      </aside>
      <main class="workspace-main" id="workspaceMain">
        <div class="tab-bar"><button id="previousTab" data-text="glyph.previous" data-label="workspace.previous"></button><div id="documentTabs" data-label="workspace.tabs"></div><button id="nextTab" data-text="glyph.next" data-label="workspace.next"></button><button id="tabNew" data-text="glyph.plus" data-label="workspace.newFile"></button></div>
        <div class="workspace-feedback"><span id="saveStatus" role="status"></span><button id="retryStorage" data-text="common.retry"></button><select id="layoutSelect" data-label="layout.label"><option value="split" data-text="layout.split"></option><option value="editor" data-text="layout.editor"></option><option value="preview" data-text="layout.preview"></option></select></div>
        <p id="workspaceNotice" role="status"></p>
        <div id="conflictActions" hidden=""><button id="keepLocal" data-text="conflict.keep"></button><button id="reloadRemote" data-text="conflict.reload"></button></div>
        <div id="titleSuggestion" hidden=""><span id="suggestedName"></span><button id="acceptTitle" data-text="title.accept"></button><button id="dismissTitle" data-text="title.dismiss"></button><button id="revertTitle" data-text="title.revert" hidden=""></button></div>
        <div id="emptyWorkspace" hidden=""><p data-text="workspace.empty"></p><button id="emptyNew" data-text="workspace.newFile"></button></div>
        <div id="documentPanel" role="tabpanel" class="document-panel" tabindex="0">
    <!-- ── Content ── -->
    <div class="content">
      <!-- Editor -->
      <div class="editor-panel" id="editorPanel">
        <div class="panel-header">
          <span class="panel-label"><span data-text="ui.editor"></span></span>
          <span class="cursor-pos" id="cursorPos"><span data-text="ui.ln.1.col.1"></span></span>
        </div>
        <div class="search-overlay" id="searchOverlay">
          <input id="searchInput" type="text" data-placeholder="ui.findx">
          <span class="search-count" id="searchCount"></span>
          <button class="tool-btn" data-command="toggleSearch()" style="padding:4px;font-size:16px;color:var(--fg-muted);" data-label="ui.close.search"><span data-text="ui.symbol88"></span></button>
        </div>
        <textarea id="editor" spellcheck="false" data-placeholder="ui.type.or.paste.your.markdown.here"></textarea>
      </div>

      <!-- Splitter -->
      <div class="splitter" id="splitter"></div>

      <!-- Preview -->
      <div class="preview-panel" id="previewPanel">
        <div class="panel-header">
          <span class="panel-label"><span data-text="ui.preview"></span></span>
        </div>
        <div id="preview" class="preview-content"></div>
      </div>

      <!-- Outline -->
      <div class="outline-panel" id="outlinePanel">
        <div class="panel-header">
          <span class="panel-label"><span data-text="ui.outline"></span></span>
        </div>
        <div class="outline-content" id="outlineContent"></div>
      </div>
    </div>

        </div>
      </main>
    </div>
    <!-- ── Status bar ── -->
    <div class="status-bar">
      <div class="stat-pills">
        <span class="stat-pill" id="statWords"><span data-text="ui.0.words"></span></span>
        <span class="stat-pill" id="statChars"><span data-text="ui.0.chars"></span></span>
        <span class="stat-pill" id="statLines"><span data-text="ui.0.lines"></span></span>
        <span class="stat-pill" id="statReadTime"><span data-text="ui.0.min.read"></span></span>
      </div>
      <div class="shortcuts" data-text="shortcut.help"></div>
    </div>
  </div>

  <dialog id="workspaceDialog" aria-labelledby="dialogTitle"><form method="dialog"></form></dialog>
  <script defer="" src="vendor/purify.min.js"></script>
  <script defer="" src="src/dom.js"></script>
  <script defer="" src="src/content-data.js"></script>
  <script defer="" src="src/json.js"></script>
  <script defer="" src="src/content.js"></script>
  <script defer="" src="src/security.js"></script>
  <script defer="" src="src/parser.js"></script>
  <script defer="" src="src/workspace/model.js"></script>
  <script defer="" src="src/workspace/db.js"></script>
  <script defer="" src="src/workspace/migration.js"></script>
  <script defer="" src="src/workspace/repository.js"></script>
  <script defer="" src="src/workspace/workspace-state.js"></script>
  <script defer="" src="src/workspace/dialog.js"></script>
  <script defer="" src="src/workspace/explorer.js"></script>
  <script defer="" src="src/workspace/tabs.js"></script>
  <script defer="" src="src/workspace/actions.js"></script>
  <script defer="" src="src/workspace/controller.js"></script>
  <script defer="" src="src/workspace/title.js"></script>
  <script defer="" src="src/workspace/shortcuts.js"></script>
  <script defer="" src="src/workspace/sync.js"></script>
  <script defer="" src="src/workspace/backup.js"></script>
  <script defer="" src="src/app.js"></script>
  <script defer="" src="src/editor/render.js"></script>
  <script defer="" src="src/editor/commands.js"></script>
  <script defer="" src="src/editor/layout.js"></script>
  <script defer="" src="src/editor/bridge.js"></script>
  <script defer="" src="src/editor/start.js"></script>
  <script defer="" src="src/workspace/start.js"></script>



</body></html>
